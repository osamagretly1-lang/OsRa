<!doctype html>
<html lang="ar" dir="rtl">
<head>

<meta name="theme-color" content="#6c4664">
<link rel="manifest" href="manifest.json">

  <button data-section="calendar">📅<small>التقويم</small></button>

  <button data-section="spiritual">☼<small>روحياتنا</small></button>
  <button data-section="messages">✉<small>رسائلنا</small></button>
  <button data-section="settings">⚙<small>المزيد</small></button><button data-section="about">♥<small>عن OsRa</small></button>

<dialog id="modal" class="modal"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></dialog>
<dialog id="lightbox" class="lightbox"><div class="lbtop"><button id="lbClose" class="round dark">×</button><span id="lbTitle"></span><div><button id="lbPrev" class="round dark">‹</button><button id="lbNext" class="round dark">›</button></div></div><div class="lbbody"><img id="lbImage" alt=""><div id="lbStatus">جارٍ فتح الصورة…</div></div></dialog>
